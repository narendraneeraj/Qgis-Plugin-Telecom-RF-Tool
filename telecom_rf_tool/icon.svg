<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4FFF"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>

    <!-- Rounded Rectangle Clip -->
    <clipPath id="iconClip">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>

    <!-- RF Glow -->
    <filter id="rfGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
      x="16"
      y="16"
      width="480"
      height="480"
      rx="96"
      fill="url(#bg)"/>

  <!-- Long Shadow -->
  <g clip-path="url(#iconClip)">
    <polygon
      points="256,150 520,414 520,520 290,520 205,430"
      fill="#000000"
      opacity="0.12"/>
  </g>

  <!-- Coverage Target -->
  <circle
      cx="256"
      cy="168"
      r="38"
      fill="none"
      stroke="#A8F8FF"
      stroke-width="4"
      opacity="0.30"/>

  <circle
      cx="256"
      cy="168"
      r="60"
      fill="none"
      stroke="#A8F8FF"
      stroke-width="3"
      opacity="0.15"/>

  <!-- RF COVERAGE -->

  <g
      fill="none"
      stroke-linecap="round"
      filter="url(#rfGlow)">

      <!-- LEFT -->

      <path
        d="M220 188
           Q175 210 220 232"
        stroke="#00E7FF"
        stroke-width="16"/>

      <path
        d="M185 155
           Q105 210 185 265"
        stroke="#6EF3FF"
        stroke-width="16"/>

      <path
        d="M145 120
           Q30 210 145 300"
        stroke="#C2FBFF"
        stroke-width="16"/>

      <!-- RIGHT -->

      <path
        d="M292 188
           Q337 210 292 232"
        stroke="#00E7FF"
        stroke-width="16"/>

      <path
        d="M327 155
           Q407 210 327 265"
        stroke="#6EF3FF"
        stroke-width="16"/>

      <path
        d="M367 120
           Q482 210 367 300"
        stroke="#C2FBFF"
        stroke-width="16"/>

  </g>

  <!-- TOWER -->

  <g fill="#FFFFFF">

    <!-- Mast -->
    <rect
      x="249"
      y="170"
      width="14"
      height="66"
      rx="3"/>

    <!-- Top Platform -->
    <rect
      x="221"
      y="236"
      width="70"
      height="14"
      rx="3"/>

    <!-- Left Leg -->
    <polygon
      points="211,430 237,250 245,250 225,430"/>

    <!-- Right Leg -->
    <polygon
      points="301,430 275,250 267,250 287,430"/>

    <!-- Beams -->
    <rect x="229" y="280" width="54" height="10" rx="2"/>
    <rect x="235" y="330" width="42" height="10" rx="2"/>
    <rect x="237" y="380" width="38" height="10" rx="2"/>

  </g>

  <!-- Lattice Braces -->

  <g
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linecap="round">

      <line x1="224" y1="290" x2="287" y2="328"/>
      <line x1="287" y1="290" x2="224" y2="328"/>

      <line x1="233" y1="340" x2="280" y2="378"/>
      <line x1="280" y1="340" x2="233" y2="378"/>

      <line x1="240" y1="390" x2="273" y2="422"/>
      <line x1="273" y1="390" x2="240" y2="422"/>

  </g>

  <!-- Antenna Node -->

  <circle
      cx="256"
      cy="168"
      r="22"
      fill="#00E7A8"/>

  <circle
      cx="256"
      cy="168"
      r="9"
      fill="#FFFFFF"/>

</svg>